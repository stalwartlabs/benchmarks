[package]
name = "mailbench"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Load generator, seeder and delivery probe for mail server benchmarks"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "macros", "sync", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
hdrhistogram = { version = "7", default-features = false, features = ["serialization"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
memchr = "2"
hashify = "0.2"
sha2 = "0.10"
sha-crypt = "0.5"

[profile.release]
lto = "thin"
codegen-units = 4
debug = "line-tables-only"
