[fdbmonitor]
user = foundationdb
group = foundationdb

[general]
restart-delay = 10
cluster-file = /etc/foundationdb/fdb.cluster

[fdbserver]
command = /usr/sbin/fdbserver
public-address = auto:$ID
listen-address = public
datadir = ${FDB_DATA}/$ID
logdir = /var/log/foundationdb
memory = ${FDB_MEMORY}
locality-machineid = ${BENCH_HOST}
locality-zoneid = ${BENCH_HOST}
