dovecot_config_version = 2.4.5
dovecot_storage_version = 2.4.5

protocols = imap lmtp
listen = *
log_path = /var/log/dovecot.log
info_log_path = /var/log/dovecot.log

mail_uid = vmail
mail_gid = vmail
first_valid_uid = 100
mail_home = ${DOVECOT_DATA}/mail/%{user | domain}/%{user | username}
mail_driver = mdbox
mail_path = ~/mdbox
mailbox_list_index = yes
mail_fsync = never
mail_always_cache_fields = flags date.received date.sent size.virtual imap.envelope imap.bodystructure hdr.from hdr.to hdr.cc hdr.subject hdr.message-id hdr.in-reply-to hdr.references

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
}

auth_mechanisms = plain login
auth_cache_size = 16M
auth_cache_ttl = 1 hour
auth_cache_negative_ttl = 1 hour

passdb passwd-file {
  passwd_file_path = ${DOVECOT_DATA}/users
}
userdb passwd-file {
  passwd_file_path = ${DOVECOT_DATA}/users
}

ssl = required
ssl_server_cert_file = ${DOVECOT_TLS}/cert.pem
ssl_server_key_file = ${DOVECOT_TLS}/key.pem
ssl_min_protocol = TLSv1.3
ssl_cipher_suites = TLS_AES_256_GCM_SHA384
ssl_curve_list = X25519
ssl_server_prefer_ciphers = server

mail_plugins {
  fts = yes
  fts_flatcurve = yes
}
fts_autoindex = yes
fts flatcurve {
}
fts_header_excludes {
  * = yes
}
fts_header_includes {
  From = yes
  To = yes
  Cc = yes
  Bcc = yes
  Subject = yes
}
language en {
  default = yes
}
language_tokenizers = generic email-address
language_filters = lowercase stopwords snowball

protocol imap {
  mail_max_userip_connections = 1000
}

service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
  restart_request_count = unlimited
  process_min_avail = 8
  client_limit = 8192
  vsz_limit = 1G
}

service imap {
  vsz_limit = 2G
  process_limit = 8192
}

service lmtp {
  unix_listener ${POSTFIX_QUEUE}/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
  process_min_avail = 25
}

service auth {
  unix_listener ${POSTFIX_QUEUE}/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

!include_try /etc/dovecot/variant.conf
