bind 0.0.0.0
protected-mode no
sentinel announce-ip ${BENCH_PRIVATE_IP}
sentinel monitor ${REDIS_SERVICE} ${REDIS_PRIMARY_IP} 6379 ${SENTINEL_QUORUM}
sentinel auth-pass ${REDIS_SERVICE} ${REDIS_PASSWORD}
sentinel down-after-milliseconds ${REDIS_SERVICE} 5000
sentinel failover-timeout ${REDIS_SERVICE} 60000
sentinel parallel-syncs ${REDIS_SERVICE} 1
