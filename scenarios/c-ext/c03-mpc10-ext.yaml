id: c03-mpc10-ext
title: "SMTP inbound sustained delivery throughput, 10 messages per connection (rate is connections/s), ladder extension above the c03-mpc10 top step (396.86 conn/s)"
family: smtp-in
mode: throughput
targets: [stalwart, dovecot]
variants: [{target: dovecot, name: fsync-always}]
repetitions: 3
cache: warm
load_hosts: all
dataset: c
timeout: 60s
slo: {p99: 1s, max_error_rate: 0.001, labels: [smtp.message]}
load:
  model: open
  ladder: {start: 396.86, factor: 1.4, steps: 8}
  warmup: 60s
  step_warmup: 10s
  step_duration: 60s
  stop_after_failures: 2
users: {set: regular}
op: {kind: smtp, port: smtp, recipients: 1, size: mix, messages_per_connection: 10}
