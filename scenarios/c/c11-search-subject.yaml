id: c11-subject
title: "IMAP SEARCH SUBJECT (header, word of rank 50 to 500)"
family: imap
mode: latency
targets: [stalwart, dovecot]
variants: [{target: dovecot, name: fsync-always}]
repetitions: 3
cache: warm
load_hosts: 1
dataset: c
load: {model: closed, sessions: 1, warmup: 60s, samples: 10000, max_duration: 30m}
users: {set: regular, min_inbox: 100}
op: {kind: imap-search, label: imap.search.subject, criteria: 'SUBJECT "{word:50-500}"'}
matrix:
  load.sessions: [1, 16]
