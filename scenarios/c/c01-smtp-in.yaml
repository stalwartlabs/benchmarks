id: c01
title: "SMTP inbound: connect to 250 after DATA, port 25 STARTTLS, one message per connection"
family: smtp-in
mode: latency
targets: [stalwart, dovecot]
variants: [{target: dovecot, name: fsync-always}]
repetitions: 3
cache: warm
load_hosts: 1
dataset: c
load: {model: closed, sessions: 1, warmup: 60s, samples: 10000, max_duration: 30m}
users: {set: regular}
op: {kind: smtp, port: smtp, recipients: 1, size: 4k, messages_per_connection: 1}
matrix:
  load.sessions: [1, 16]
  op.recipients: [1, 10]
  op.size: [4k, 64k, mix]
