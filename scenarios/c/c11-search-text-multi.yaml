id: c11-text-multi
title: "IMAP SEARCH TEXT with two terms (ranks 200 to 2000)"
family: imap
mode: latency
targets: [stalwart, dovecot]
variants: [{target: dovecot, name: fsync-always}]
repetitions: 3
cache: warm
load_hosts: 1
dataset: c
load: {model: closed, sessions: 1, warmup: 60s, samples: 10000, max_duration: 30m}
users: {set: regular, min_inbox: 100}
op: {kind: imap-search, label: imap.search.text-multi, criteria: 'TEXT "{word:200-2000}" TEXT "{word:200-2000}"'}
matrix:
  load.sessions: [1, 16]
