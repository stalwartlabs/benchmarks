id: c11-body-rare
title: "IMAP SEARCH BODY single rare term (rank 5000 to 20000)"
family: imap
mode: latency
targets: [stalwart, dovecot]
variants: [{target: dovecot, name: fsync-always}]
repetitions: 3
cache: warm
load_hosts: 1
dataset: c
load: {model: closed, sessions: 1, warmup: 60s, samples: 10000, max_duration: 30m}
users: {set: regular, min_inbox: 100}
op: {kind: imap-search, label: imap.search.body-rare, criteria: 'BODY "{word:5000-20000}"'}
matrix:
  load.sessions: [1, 16]
