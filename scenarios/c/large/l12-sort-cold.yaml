id: l12-sort-cold
title: "Large mailboxes: SORT by date, from and subject (cold cache)"
family: imap-large
mode: latency
targets: [stalwart, dovecot]
variants: [{target: dovecot, name: fsync-always}]
repetitions: 5
cache: cold
cold_open: true
load_hosts: 1
dataset: c
timeout: 600s
load: {model: closed, sessions: 1, warmup: 0s, samples: 20, max_duration: 20m, session_ops: 1000}
users: {set: large, account: large10k}
op: {kind: imap-sort, key: date}
matrix:
  users.account: [large10k, large100k, large250k]
  op.key: [date, from, subject]
