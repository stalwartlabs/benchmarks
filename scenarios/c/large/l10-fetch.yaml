id: l10-fetch
title: "Large mailboxes: FETCH FLAGS UID 1:*, ENVELOPE BODYSTRUCTURE last 50, HEADER.FIELDS range of 100, BODY.PEEK[] random (warm cache)"
family: imap-large
mode: latency
targets: [stalwart, dovecot]
variants: [{target: dovecot, name: fsync-always}]
repetitions: 3
cache: warm
load_hosts: 1
dataset: c
timeout: 600s
load: {model: closed, sessions: 1, warmup: 30s, samples: 200, max_duration: 20m, session_ops: 1000}
users: {set: large, account: large10k}
op: {kind: imap-fetch, fetch: flags-all}
matrix:
  users.account: [large10k, large100k, large250k]
  op.fetch: [flags-all, envelope-last, header-fields-range, body-random]
