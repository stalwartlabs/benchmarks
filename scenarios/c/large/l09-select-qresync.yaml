id: l09-select-qresync
title: "Large mailboxes: SELECT INBOX with QRESYNC after 100 flag changes (warm cache)"
family: imap-large
mode: latency
targets: [stalwart, dovecot]
variants: [{target: dovecot, name: fsync-always}]
repetitions: 3
cache: warm
load_hosts: 1
dataset: c
timeout: 600s
load: {model: closed, sessions: 1, warmup: 30s, samples: 200, max_duration: 20m, session_ops: 1000}
users: {set: large, account: large10k}
op: {kind: imap-select, folder: INBOX, qresync_changes: 100}
matrix:
  users.account: [large10k, large100k, large250k]
