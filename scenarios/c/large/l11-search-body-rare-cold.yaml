id: l11-search-body-rare-cold
title: "Large mailboxes: SEARCH BODY rare term rank 5000 to 20000 (cold cache)"
family: imap-large
mode: latency
targets: [stalwart, dovecot]
variants: [{target: dovecot, name: fsync-always}]
repetitions: 5
cache: cold
cold_open: true
load_hosts: 1
dataset: c
timeout: 600s
load: {model: closed, sessions: 1, warmup: 0s, samples: 20, max_duration: 20m, session_ops: 1000}
users: {set: large, account: large10k}
op: {kind: imap-search, label: imap.search.body-rare, criteria: 'BODY "{word:5000-20000}"'}
matrix:
  users.account: [large10k, large100k, large250k]
