id: l11-search-text-multi
title: "Large mailboxes: SEARCH TEXT two terms rank 200 to 2000 (warm cache)"
family: imap-large
mode: latency
targets: [stalwart, dovecot]
variants: [{target: dovecot, name: fsync-always}]
repetitions: 3
cache: warm
load_hosts: 1
dataset: c
timeout: 600s
load: {model: closed, sessions: 1, warmup: 30s, samples: 200, max_duration: 20m, session_ops: 1000}
users: {set: large, account: large10k}
op: {kind: imap-search, label: imap.search.text-multi, criteria: 'TEXT "{word:200-2000}" TEXT "{word:200-2000}"'}
matrix:
  users.account: [large10k, large100k, large250k]
