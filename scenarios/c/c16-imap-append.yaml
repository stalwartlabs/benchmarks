id: c16
title: "IMAP APPEND per size bucket (APPEND to tagged OK)"
family: imap
mode: latency
targets: [stalwart, dovecot]
variants: [{target: dovecot, name: fsync-always}]
repetitions: 3
cache: warm
load_hosts: 1
dataset: c
load: {model: closed, sessions: 1, warmup: 60s, samples: 10000, max_duration: 30m}
users: {set: regular}
op: {kind: imap-append, folder: BenchAppend, size: 4k}
matrix:
  load.sessions: [1, 16]
  op.size: [4k, 64k]
