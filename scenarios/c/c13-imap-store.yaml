id: c13
title: "IMAP STORE +FLAGS on one message, a range of 100 and 1:* (flag cleared untimed before each sample)"
family: imap
mode: latency
targets: [stalwart, dovecot]
variants: [{target: dovecot, name: fsync-always}]
repetitions: 3
cache: warm
load_hosts: 1
dataset: c
load: {model: closed, sessions: 1, warmup: 60s, samples: 10000, max_duration: 30m}
users: {set: regular, min_inbox: 100}
op: {kind: imap-store, flag: '\Seen', range: one}
matrix:
  load.sessions: [1, 16]
  op.flag: ['\Seen', '\Flagged']
  op.range: [one, 100, all]
