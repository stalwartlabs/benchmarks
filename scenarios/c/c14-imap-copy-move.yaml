id: c14
title: "IMAP COPY and MOVE of 1, 100 and 10% of INBOX to another folder (undone untimed after each sample)"
family: imap
mode: latency
targets: [stalwart, dovecot]
variants: [{target: dovecot, name: fsync-always}]
repetitions: 3
cache: warm
load_hosts: 1
dataset: c
load: {model: closed, sessions: 1, warmup: 60s, samples: 10000, max_duration: 30m}
users: {set: regular, min_inbox: 100}
op: {kind: imap-copy, mode: copy, range: one, destination: BenchTarget}
matrix:
  load.sessions: [1, 16]
  op.mode: [copy, move]
  op.range: [one, 100, 10%]
