id: c11-from
title: "IMAP SEARCH FROM (header, contact surname drawn by Zipf)"
family: imap
mode: latency
targets: [stalwart, dovecot]
variants: [{target: dovecot, name: fsync-always}]
repetitions: 3
cache: warm
load_hosts: 1
dataset: c
load: {model: closed, sessions: 1, warmup: 60s, samples: 10000, max_duration: 30m}
users: {set: regular, min_inbox: 100}
op: {kind: imap-search, label: imap.search.from, criteria: 'FROM "{contact}"'}
matrix:
  load.sessions: [1, 16]
