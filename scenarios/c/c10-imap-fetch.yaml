id: c10
title: "IMAP FETCH: FLAGS UID for 1:*, ENVELOPE BODYSTRUCTURE for the last 50, HEADER.FIELDS for a range of 100, BODY.PEEK[] of a random message"
family: imap
mode: latency
targets: [stalwart, dovecot]
variants: [{target: dovecot, name: fsync-always}]
repetitions: 3
cache: warm
load_hosts: 1
dataset: c
load: {model: closed, sessions: 1, warmup: 60s, samples: 10000, max_duration: 30m}
users: {set: regular, min_inbox: 100}
op: {kind: imap-fetch, fetch: flags-all, count: 0}
matrix:
  load.sessions: [1, 16]
  op.fetch: [flags-all, envelope-last, header-fields-range, body-random]
