id: c12
title: "IMAP SORT by date, from and subject"
family: imap
mode: latency
targets: [stalwart, dovecot]
variants: [{target: dovecot, name: fsync-always}]
repetitions: 3
cache: warm
load_hosts: 1
dataset: c
load: {model: closed, sessions: 1, warmup: 60s, samples: 10000, max_duration: 30m}
users: {set: regular, min_inbox: 100}
op: {kind: imap-sort, key: date}
matrix:
  load.sessions: [1, 16]
  op.key: [date, from, subject]
